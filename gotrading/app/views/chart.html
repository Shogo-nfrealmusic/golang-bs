<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chart</title>
    <style>
      #dashboard_div {
        width: 900px;
      }
      #chart_div {
        height: 450px;
      }
      #volume_div {
        height: 120px;
        margin-top: 4px;
      }
      #rsi_div {
        height: 120px;
        margin-top: 4px;
      }
      #filter_div {
        height: 80px;
        margin-top: 8px;
      }
    </style>
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript">
      var config = {
        api: {
          interval: 1000 * 3,
          enable: true,
        },
        candlestick: {
          product_code: "BTC_JPY",
          duration: "1m",
          limit: 365,
        },
        dataTable: {
          index: 0,
          value: null,
        },
        sma: {
          enable: false,
          indexes: [],
          periods: [],
          values: [],
        },
        ema: {
          enable: false,
          indexes: [],
          periods: [],
          values: [],
        },
        bbands: {
          enable: false,
          n: 20,
          k: 2,
          sets: [],
        },
        ichimoku: {
          enable: false,
          set: null,
        },
        volume: {
          enable: false,
          index: 5,
        },
        rsi: {
          enable: false,
          period: 14,
          indexes: [],
          values: [],
        },
      };

      function initConfigValues() {
        config.dataTable.index = 0;
        config.sma.indexes = [];
        config.sma.values = [];
        config.ema.indexes = [];
        config.ema.values = [];
        config.bbands.sets = [];
        config.ichimoku.set = null;
        config.volume.index = 5;
        config.rsi.indexes = [];
        config.rsi.values = [];
      }

      function appendOverlayIndexes(cols, indexes) {
        for (var i = 0; i < indexes.length; i++) {
          var colIndex = indexes[i];
          if (colIndex !== undefined) {
            cols.push(colIndex);
          }
        }
      }

      function buildMainChartViewColumns() {
        var cols = [
          {
            calc: function (dt, row) {
              return dt.getFormattedValue(row, 0);
            },
            type: "string",
          },
          1,
          2,
          3,
          4,
        ];
        appendOverlayIndexes(cols, config.sma.indexes);
        appendOverlayIndexes(cols, config.ema.indexes);
        for (var b = 0; b < config.bbands.sets.length; b++) {
          var bbSet = config.bbands.sets[b];
          appendOverlayIndexes(cols, [bbSet.indexUp, bbSet.indexMid, bbSet.indexDown]);
        }
        if (config.ichimoku.set) {
          appendOverlayIndexes(cols, config.ichimoku.set.indexes);
        }
        return cols;
      }

      function buildOverlaySeriesOptions() {
        var series = {};
        var smaColors = ["#3366cc", "#dc3912", "#ff9900"];
        var emaColors = ["#9900cc", "#00acc1", "#e91e63"];
        var seriesIndex = 1;
        for (var i = 0; i < config.sma.indexes.length; i++) {
          if (config.sma.indexes[i] !== undefined) {
            series[seriesIndex] = {
              type: "line",
              lineWidth: 1,
              color: smaColors[i % smaColors.length],
            };
            seriesIndex += 1;
          }
        }
        for (var j = 0; j < config.ema.indexes.length; j++) {
          if (config.ema.indexes[j] !== undefined) {
            series[seriesIndex] = {
              type: "line",
              lineWidth: 1,
              lineDashStyle: [6, 4],
              color: emaColors[j % emaColors.length],
            };
            seriesIndex += 1;
          }
        }
        for (var b = 0; b < config.bbands.sets.length; b++) {
          var bbSet = config.bbands.sets[b];
          if (bbSet.indexUp !== undefined) {
            series[seriesIndex] = {
              type: "line",
              lineWidth: 1,
              color: "#90a4ae",
            };
            seriesIndex += 1;
          }
          if (bbSet.indexMid !== undefined) {
            series[seriesIndex] = {
              type: "line",
              lineWidth: 1,
              lineDashStyle: [2, 2],
              color: "#546e7a",
            };
            seriesIndex += 1;
          }
          if (bbSet.indexDown !== undefined) {
            series[seriesIndex] = {
              type: "line",
              lineWidth: 1,
              color: "#90a4ae",
            };
            seriesIndex += 1;
          }
        }
        if (config.ichimoku.set) {
          var ichimokuSeries = [
            { color: "#e53935", lineWidth: 1 },
            { color: "#1e88e5", lineWidth: 1 },
            { color: "#43a047", lineWidth: 1, lineDashStyle: [4, 4] },
            { color: "#fb8c00", lineWidth: 1, lineDashStyle: [4, 4] },
            { color: "#8e24aa", lineWidth: 1, lineDashStyle: [2, 6] },
          ];
          for (var ic = 0; ic < ichimokuSeries.length; ic++) {
            series[seriesIndex] = {
              type: "line",
              lineWidth: ichimokuSeries[ic].lineWidth,
              color: ichimokuSeries[ic].color,
            };
            if (ichimokuSeries[ic].lineDashStyle) {
              series[seriesIndex].lineDashStyle = ichimokuSeries[ic].lineDashStyle;
            }
            seriesIndex += 1;
          }
        }
        return series;
      }

      function hasOverlays() {
        return (
          config.sma.indexes.length > 0 ||
          config.ema.indexes.length > 0 ||
          config.bbands.sets.length > 0 ||
          config.ichimoku.set !== null
        );
      }

      function addMovingAverageColumns(dataTable, items, labelPrefix, target) {
        if (!items || items.length === 0) {
          return;
        }
        for (var s = 0; s < items.length; s++) {
          var maData = items[s];
          if (!maData.values || maData.values.length === 0) {
            continue;
          }
          config.dataTable.index += 1;
          target.indexes[s] = config.dataTable.index;
          dataTable.addColumn(
            "number",
            labelPrefix + maData.period.toString(),
          );
          target.values[s] = maData.values;
        }
      }

      function appendMovingAverageValues(row, valuesList, candleIndex) {
        for (var j = 0; j < valuesList.length; j++) {
          var maValues = valuesList[j];
          if (!maValues) {
            row.push(null);
            continue;
          }
          var v = maValues[candleIndex];
          row.push(v != null && !isNaN(v) ? v : null);
        }
      }

      function sanitizeChartValue(v) {
        return v != null && !isNaN(v) ? v : null;
      }

      function addBbandsColumns(dataTable, items) {
        if (!items || items.length === 0) {
          return;
        }
        for (var b = 0; b < items.length; b++) {
          var bb = items[b];
          if (!bb.up || !bb.mid || !bb.down || bb.up.length === 0) {
            continue;
          }
          var label = "BB" + bb.n.toString() + "x" + bb.k.toString();
          config.dataTable.index += 1;
          var indexUp = config.dataTable.index;
          dataTable.addColumn("number", label + " Up");
          config.dataTable.index += 1;
          var indexMid = config.dataTable.index;
          dataTable.addColumn("number", label + " Mid");
          config.dataTable.index += 1;
          var indexDown = config.dataTable.index;
          dataTable.addColumn("number", label + " Down");
          config.bbands.sets.push({
            indexUp: indexUp,
            indexMid: indexMid,
            indexDown: indexDown,
            up: bb.up,
            mid: bb.mid,
            down: bb.down,
          });
        }
      }

      function appendBbandsValues(row, candleIndex) {
        for (var b = 0; b < config.bbands.sets.length; b++) {
          var bbSet = config.bbands.sets[b];
          row.push(sanitizeChartValue(bbSet.up[candleIndex]));
          row.push(sanitizeChartValue(bbSet.mid[candleIndex]));
          row.push(sanitizeChartValue(bbSet.down[candleIndex]));
        }
      }

      function addIchimokuColumns(dataTable, ichimoku) {
        if (!ichimoku) {
          return;
        }
        var lines = [
          { key: "tenkan", label: "Tenkan" },
          { key: "kikun", label: "Kikun" },
          { key: "senkou_a", label: "SenkouA" },
          { key: "senkou_b", label: "SenkouB" },
          { key: "chikou", label: "Chikou" },
        ];
        var set = { indexes: [], order: [], values: {} };
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var values = ichimoku[line.key];
          if (!values || values.length === 0) {
            continue;
          }
          config.dataTable.index += 1;
          set.indexes.push(config.dataTable.index);
          set.order.push(line.key);
          dataTable.addColumn("number", line.label);
          set.values[line.key] = values;
        }
        if (set.order.length > 0) {
          config.ichimoku.set = set;
        }
      }

      function appendIchimokuValues(row, candleIndex) {
        if (!config.ichimoku.set) {
          return;
        }
        for (var i = 0; i < config.ichimoku.set.order.length; i++) {
          var key = config.ichimoku.set.order[i];
          var values = config.ichimoku.set.values[key];
          row.push(sanitizeChartValue(values[candleIndex]));
        }
      }

      function addRsiColumns(dataTable, items) {
        if (!items || items.length === 0) {
          return;
        }
        for (var r = 0; r < items.length; r++) {
          var rsiData = items[r];
          if (!rsiData.values || rsiData.values.length === 0) {
            continue;
          }
          config.dataTable.index += 1;
          config.rsi.indexes[r] = config.dataTable.index;
          dataTable.addColumn("number", "RSI" + rsiData.period.toString());
          config.rsi.values[r] = rsiData.values;
        }
      }

      function appendRsiValues(row, candleIndex) {
        for (var j = 0; j < config.rsi.values.length; j++) {
          var rsiValues = config.rsi.values[j];
          if (!rsiValues) {
            row.push(null);
            continue;
          }
          row.push(sanitizeChartValue(rsiValues[candleIndex]));
        }
      }

      function drawChart(dataTable) {
        var dashboard = new google.visualization.Dashboard(
          document.getElementById("dashboard_div"),
        );

        var chartOptions = {
          hAxis: { slantedText: false },
          legend: { position: hasOverlays() ? "bottom" : "none" },
          candlestick: {
            fallingColor: { strokeWidth: 0, fill: "#a52714" },
            risingColor: { strokeWidth: 0, fill: "#0f9d58" },
          },
          seriesType: "candlesticks",
        };
        var overlaySeries = buildOverlaySeriesOptions();
        if (Object.keys(overlaySeries).length > 0) {
          chartOptions.series = overlaySeries;
        }

        var mainChart = new google.visualization.ChartWrapper({
          chartType: "ComboChart",
          containerId: "chart_div",
          options: chartOptions,
          view: {
            columns: buildMainChartViewColumns(),
          },
        });

        var charts = [mainChart];
        if (config.volume.enable === true) {
          var volumeChart = new google.visualization.ChartWrapper({
            chartType: "ColumnChart",
            containerId: "volume_div",
            options: {
              legend: { position: "none" },
              hAxis: { slantedText: false },
              vAxis: { minValue: 0, textPosition: "none" },
              chartArea: { width: "100%", height: "80%" },
              colors: ["#78909c"],
            },
            view: {
              columns: [0, config.volume.index],
            },
          });
          charts.push(volumeChart);
        } else {
          document.getElementById("volume_div").innerHTML = "";
        }

        if (config.rsi.enable === true && config.rsi.indexes.length > 0) {
          var rsiColumns = [0, config.rsi.indexes[0]];
          var rsiChart = new google.visualization.ChartWrapper({
            chartType: "LineChart",
            containerId: "rsi_div",
            options: {
              legend: { position: "none" },
              hAxis: { slantedText: false },
              vAxis: {
                minValue: 0,
                maxValue: 100,
                viewWindow: { min: 0, max: 100 },
                ticks: [30, 50, 70],
              },
              chartArea: { width: "100%", height: "80%" },
              colors: ["#7b1fa2"],
            },
            view: {
              columns: rsiColumns,
            },
          });
          charts.push(rsiChart);
        } else {
          document.getElementById("rsi_div").innerHTML = "";
        }

        var controlWrapper = new google.visualization.ControlWrapper({
          controlType: "ChartRangeFilter",
          containerId: "filter_div",
          options: {
            filterColumnIndex: 0,
            ui: {
              chartType: "LineChart",
              chartView: {
                columns: [0, 4],
              },
              chartOptions: {
                height: 80,
                width: 900,
                chartArea: { width: "100%", height: "100%" },
                hAxis: { baselineColor: "none" },
                legend: { position: "none" },
              },
            },
          },
        });

        dashboard.bind(controlWrapper, charts);
        dashboard.draw(dataTable);
      }

      function send() {
        if (config.api.enable === false) {
          return;
        }
        var params = {
          product_code: config.candlestick.product_code,
          limit: config.candlestick.limit,
          duration: config.candlestick.duration,
        };

        if (config.sma.enable === true) {
          params["sma"] = true;
          params["smaPeriod1"] = config.sma.periods[0];
          params["smaPeriod2"] = config.sma.periods[1];
          params["smaPeriod3"] = config.sma.periods[2];
        }
        if (config.ema.enable === true) {
          params["ema"] = true;
          params["emaPeriod1"] = config.ema.periods[0];
          params["emaPeriod2"] = config.ema.periods[1];
          params["emaPeriod3"] = config.ema.periods[2];
        }
        if (config.bbands.enable === true) {
          params["bbands"] = true;
          params["bbandsN"] = config.bbands.n;
          params["bbandsK"] = config.bbands.k;
        }
        if (config.ichimoku.enable === true) {
          params["ichimoku"] = true;
        }
        if (config.rsi.enable === true) {
          params["rsi"] = true;
          params["rsiPeriod"] = config.rsi.period;
        }

        $.getJSON("/api/candle/", params)
          .done(function (data) {
            console.log(data);
            var candles = data.candles || [];
            if (candles.length === 0) {
              $("#status").text("No candle data");
              return;
            }

            initConfigValues();
            var dataTable = new google.visualization.DataTable();
            dataTable.addColumn("datetime", "Time");
            dataTable.addColumn("number", "Low");
            dataTable.addColumn("number", "Open");
            dataTable.addColumn("number", "Close");
            dataTable.addColumn("number", "High");
            if (config.volume.enable === true) {
              config.volume.index = 5;
              dataTable.addColumn("number", "Volume");
              config.dataTable.index = 5;
            } else {
              config.dataTable.index = 4;
            }
            addMovingAverageColumns(dataTable, data.smas, "SMA", config.sma);
            addMovingAverageColumns(dataTable, data.emas, "EMA", config.ema);
            addBbandsColumns(dataTable, data.bbands);
            addIchimokuColumns(dataTable, data.ichimoku);
            addRsiColumns(dataTable, data.rsis);

            var rows = [];
            for (var i = 0; i < candles.length; i++) {
              var candle = candles[i];
              var row = [
                new Date(candle.time),
                candle.low,
                candle.open,
                candle.close,
                candle.high,
              ];
              if (config.volume.enable === true) {
                row.push(candle.volume || 0);
              }
              appendMovingAverageValues(row, config.sma.values, i);
              appendMovingAverageValues(row, config.ema.values, i);
              appendBbandsValues(row, i);
              appendIchimokuValues(row, i);
              appendRsiValues(row, i);
              rows.push(row);
            }

            dataTable.addRows(rows);
            drawChart(dataTable);
            $("#status").text("");
          })
          .fail(function (xhr) {
            console.error(xhr.responseText);
            $("#status").text("API error: " + xhr.status);
          });
      }

      function changeDuration(duration) {
        config.candlestick.duration = duration;
        send();
      }

      google.charts.load("current", { packages: ["corechart", "controls"] });
      function initIndicatorParams() {
        config.sma.periods[0] = parseInt($("#inputSmaPeriod1").val(), 10) || 7;
        config.sma.periods[1] = parseInt($("#inputSmaPeriod2").val(), 10) || 14;
        config.sma.periods[2] = parseInt($("#inputSmaPeriod3").val(), 10) || 21;
        config.ema.periods[0] = parseInt($("#inputEmaPeriod1").val(), 10) || 12;
        config.ema.periods[1] = parseInt($("#inputEmaPeriod2").val(), 10) || 26;
        config.ema.periods[2] = parseInt($("#inputEmaPeriod3").val(), 10) || 50;
        config.bbands.n = parseInt($("#inputBbandsN").val(), 10) || 20;
        config.bbands.k = parseFloat($("#inputBbandsK").val()) || 2;
        config.rsi.period = parseInt($("#inputRsiPeriod").val(), 10) || 14;
      }

      google.charts.setOnLoadCallback(function () {
        initIndicatorParams();
        send();
        setInterval(send, config.api.interval);

        $("#dashboard_div")
          .mouseenter(function () {
            config.api.enable = false;
          })
          .mouseleave(function () {
            config.api.enable = true;
          });
        $("#inputSma").change(function () {
          if (this.checked === true) {
            config.sma.enable = true;
          } else {
            config.sma.enable = false;
          }
          send();
        });
        $("#inputSmaPeriod1").change(function () {
          config.sma.periods[0] = parseInt(this.value);
          send();
        });
        $("#inputSmaPeriod2").change(function () {
          config.sma.periods[1] = parseInt(this.value);
          send();
        });
        $("#inputSmaPeriod3").change(function () {
          config.sma.periods[2] = parseInt(this.value);
          send();
        });
        $("#inputEma").change(function () {
          config.ema.enable = this.checked === true;
          send();
        });
        $("#inputEmaPeriod1").change(function () {
          config.ema.periods[0] = parseInt(this.value, 10);
          send();
        });
        $("#inputEmaPeriod2").change(function () {
          config.ema.periods[1] = parseInt(this.value, 10);
          send();
        });
        $("#inputEmaPeriod3").change(function () {
          config.ema.periods[2] = parseInt(this.value, 10);
          send();
        });
        $("#inputBbands").change(function () {
          config.bbands.enable = this.checked === true;
          send();
        });
        $("#inputBbandsN").change(function () {
          config.bbands.n = parseInt(this.value, 10);
          send();
        });
        $("#inputBbandsK").change(function () {
          config.bbands.k = parseFloat(this.value);
          send();
        });
        $("#inputIchimoku").change(function () {
          config.ichimoku.enable = this.checked === true;
          send();
        });
        $("#inputVolume").change(function () {
          config.volume.enable = this.checked === true;
          send();
        });
        $("#inputRsi").change(function () {
          config.rsi.enable = this.checked === true;
          send();
        });
        $("#inputRsiPeriod").change(function () {
          config.rsi.period = parseInt(this.value, 10) || 14;
          send();
        });
      });
    </script>
  </head>
  <body>
    <div>
      <button onclick="changeDuration('1s')">1s</button>
      <button onclick="changeDuration('1m')">1m</button>
      <button onclick="changeDuration('1h')">1h</button>
      <button onclick="changeDuration('1mo')">1mo</button>
      <button onclick="changeDuration('1y')">1y</button>
    </div>
    <div>
      SMA <input id="inputSma" type="checkbox" /> Period
      <input id="inputSmaPeriod1" type="number" value="7" min="1" style="width: 40px" />
      <input id="inputSmaPeriod2" type="number" value="14" min="1" style="width: 40px" />
      <input id="inputSmaPeriod3" type="number" value="21" min="1" style="width: 40px" />
    </div>
    <div>
      EMA <input id="inputEma" type="checkbox" /> Period
      <input id="inputEmaPeriod1" type="number" value="12" min="1" style="width: 40px" />
      <input id="inputEmaPeriod2" type="number" value="26" min="1" style="width: 40px" />
      <input id="inputEmaPeriod3" type="number" value="50" min="1" style="width: 40px" />
    </div>
    <div>
      BBands <input id="inputBbands" type="checkbox" />
      N <input id="inputBbandsN" type="number" value="20" min="2" style="width: 40px" />
      K <input id="inputBbandsK" type="number" value="2" min="0.1" step="0.1" style="width: 40px" />
    </div>
    <div>
      一目 <input id="inputIchimoku" type="checkbox" />
      (9 / 26 / 52 / 先行26)
    </div>
    <div>
      Volume <input id="inputVolume" type="checkbox" />
    </div>
    <div>
      RSI <input id="inputRsi" type="checkbox" />
      Period <input id="inputRsiPeriod" type="number" value="14" min="2" style="width: 40px" />
    </div>
    <div id="status"></div>
    <div id="dashboard_div">
      <div id="chart_div"></div>
      <div id="volume_div"></div>
      <div id="rsi_div"></div>
      <div id="filter_div"></div>
    </div>
  </body>
</html>
