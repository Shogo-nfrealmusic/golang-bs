<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chart</title>
    <style>
      #dashboard_div {
        width: 900px;
      }
      #chart_div {
        height: 450px;
      }
      #filter_div {
        height: 80px;
        margin-top: 8px;
      }
    </style>
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript">
      var config = {
        api: {
          interval: 1000 * 3,
          enable: true,
        },
        candlestick: {
          product_code: "BTC_JPY",
          duration: "1m",
          limit: 365,
        },
        dataTable: {
          index: 0,
          value: null,
        },
        sma: {
          enable: false,
          indexes: [],
          periods: [],
          values: [],
        },
      };

      function initConfigValues() {
        config.dataTable.index = 0;
        config.sma.indexes = [];
        config.sma.values = [];
      }

      function buildMainChartViewColumns() {
        var cols = [
          {
            calc: function (dt, row) {
              return dt.getFormattedValue(row, 0);
            },
            type: "string",
          },
          1,
          2,
          3,
          4,
        ];
        for (var i = 0; i < config.sma.indexes.length; i++) {
          var colIndex = config.sma.indexes[i];
          if (colIndex !== undefined) {
            cols.push(colIndex);
          }
        }
        return cols;
      }

      function buildSmaSeriesOptions() {
        var series = {};
        var colors = ["#3366cc", "#dc3912", "#ff9900"];
        for (var i = 0; i < config.sma.indexes.length; i++) {
          if (config.sma.indexes[i] !== undefined) {
            series[i + 1] = {
              type: "line",
              lineWidth: 1,
              color: colors[i % colors.length],
            };
          }
        }
        return series;
      }

      function drawChart(dataTable) {
        var dashboard = new google.visualization.Dashboard(
          document.getElementById("dashboard_div"),
        );

        var chartOptions = {
          hAxis: { slantedText: false },
          legend: { position: config.sma.indexes.length > 0 ? "bottom" : "none" },
          candlestick: {
            fallingColor: { strokeWidth: 0, fill: "#a52714" },
            risingColor: { strokeWidth: 0, fill: "#0f9d58" },
          },
          seriesType: "candlesticks",
        };
        var smaSeries = buildSmaSeriesOptions();
        if (Object.keys(smaSeries).length > 0) {
          chartOptions.series = smaSeries;
        }

        var mainChart = new google.visualization.ChartWrapper({
          chartType: "ComboChart",
          containerId: "chart_div",
          options: chartOptions,
          view: {
            columns: buildMainChartViewColumns(),
          },
        });

        var controlWrapper = new google.visualization.ControlWrapper({
          controlType: "ChartRangeFilter",
          containerId: "filter_div",
          options: {
            filterColumnIndex: 0,
            ui: {
              chartType: "LineChart",
              chartView: {
                columns: [0, 4],
              },
              chartOptions: {
                height: 80,
                width: 900,
                chartArea: { width: "100%", height: "100%" },
                hAxis: { baselineColor: "none" },
                legend: { position: "none" },
              },
            },
          },
        });

        dashboard.bind(controlWrapper, mainChart);
        dashboard.draw(dataTable);
      }

      function send() {
        if (config.api.enable === false) {
          return;
        }
        var params = {
          product_code: config.candlestick.product_code,
          limit: config.candlestick.limit,
          duration: config.candlestick.duration,
        };

        if (config.sma.enable === true) {
          params["sma"] = true;
          params["smaPeriod1"] = config.sma.periods[0];
          params["smaPeriod2"] = config.sma.periods[1];
          params["smaPeriod3"] = config.sma.periods[2];
        }

        $.getJSON("/api/candle/", params)
          .done(function (data) {
            console.log(data);
            var candles = data.candles || [];
            if (candles.length === 0) {
              $("#status").text("No candle data");
              return;
            }

            initConfigValues();
            var dataTable = new google.visualization.DataTable();
            dataTable.addColumn("datetime", "Time");
            dataTable.addColumn("number", "Low");
            dataTable.addColumn("number", "Open");
            dataTable.addColumn("number", "Close");
            dataTable.addColumn("number", "High");
            if (data.smas && data.smas.length > 0) {
              for (var s = 0; s < data.smas.length; s++) {
                var smaData = data.smas[s];
                if (!smaData.values || smaData.values.length === 0) {
                  continue;
                }
                config.dataTable.index += 1;
                config.sma.indexes[s] = config.dataTable.index;
                dataTable.addColumn(
                  "number",
                  "SMA" + smaData.period.toString(),
                );
                config.sma.values[s] = smaData.values;
              }
            }

            var rows = [];
            for (var i = 0; i < candles.length; i++) {
              var candle = candles[i];
              var row = [
                new Date(candle.time),
                candle.low,
                candle.open,
                candle.close,
                candle.high,
              ];
              for (var j = 0; j < config.sma.values.length; j++) {
                var smaValues = config.sma.values[j];
                if (!smaValues) {
                  row.push(null);
                  continue;
                }
                var v = smaValues[i];
                row.push(v != null && !isNaN(v) ? v : null);
              }
              rows.push(row);
            }

            dataTable.addRows(rows);
            drawChart(dataTable);
            $("#status").text("");
          })
          .fail(function (xhr) {
            console.error(xhr.responseText);
            $("#status").text("API error: " + xhr.status);
          });
      }

      function changeDuration(duration) {
        config.candlestick.duration = duration;
        send();
      }

      google.charts.load("current", { packages: ["corechart", "controls"] });
      function initSmaPeriods() {
        config.sma.periods[0] = parseInt($("#inputSmaPeriod1").val(), 10) || 7;
        config.sma.periods[1] = parseInt($("#inputSmaPeriod2").val(), 10) || 14;
        config.sma.periods[2] = parseInt($("#inputSmaPeriod3").val(), 10) || 21;
      }

      google.charts.setOnLoadCallback(function () {
        initSmaPeriods();
        send();
        setInterval(send, config.api.interval);

        $("#dashboard_div")
          .mouseenter(function () {
            config.api.enable = false;
          })
          .mouseleave(function () {
            config.api.enable = true;
          });
        $("#inputSma").change(function () {
          if (this.checked === true) {
            config.sma.enable = true;
          } else {
            config.sma.enable = false;
          }
          send();
        });
        $("#inputSmaPeriod1").change(function () {
          config.sma.periods[0] = parseInt(this.value);
          send();
        });
        $("#inputSmaPeriod2").change(function () {
          config.sma.periods[1] = parseInt(this.value);
          send();
        });
        $("#inputSmaPeriod3").change(function () {
          config.sma.periods[2] = parseInt(this.value);
          send();
        });
      });
    </script>
  </head>
  <body>
    <div>
      <button onclick="changeDuration('1s')">1s</button>
      <button onclick="changeDuration('1m')">1m</button>
      <button onclick="changeDuration('1h')">1h</button>
      <button onclick="changeDuration('1mo')">1mo</button>
      <button onclick="changeDuration('1y')">1y</button>
    </div>
    <div>
      SMA <input id="inputSma" type="checkbox" /> Period
      <input id="inputSmaPeriod1" type="number" value="7" min="1" style="width: 40px" />
      <input id="inputSmaPeriod2" type="number" value="14" min="1" style="width: 40px" />
      <input id="inputSmaPeriod3" type="number" value="21" min="1" style="width: 40px" />
    </div>
    <div id="status"></div>
    <div id="dashboard_div">
      <div id="chart_div"></div>
      <div id="filter_div"></div>
    </div>
  </body>
</html>
