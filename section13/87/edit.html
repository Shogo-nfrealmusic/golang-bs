<h1>Editing {{.Title}}</h1>

<form action="/save/{{.Title}}" method="post">
  <div>
    <textarea
      name="body"
      rows="20"
      cols="80"
      placeholder="Enter your content here..."
    >
{{printf "%s" .Body}}</textarea
    >
  </div>
  <div><input type="submit" value="Save" /></div>
</form>
